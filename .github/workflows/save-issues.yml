name: Save Open Issues as .TXT

on:
  workflow_dispatch:

jobs:
  save-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and save bug and unlabeled issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const dir = path.join(process.env.GITHUB_WORKSPACE, 'Bugs');
            if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const issueList = [];
            for (const issue of issues.data) {
              if (issue.pull_request) continue;

              const hasBugLabel = issue.labels.some(l => l.name === 'bug');
              const isUnlabeled = issue.labels.length === 0;

              // Include if it's a bug or has no labels at all
              if (hasBugLabel || isUnlabeled) {
                issueList.push(`Title: ${issue.title}\nDes: ${issue.body || 'No description provided.'}`);
              }
            }

            const filePath = path.join(dir, 'issues.txt');
            fs.writeFileSync(filePath, issueList.join('\n-\n'));

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Bugs/
          git diff --staged --quiet || git commit -m "docs: update bug and unlabeled issues txt file [skip ci]"
          git push
