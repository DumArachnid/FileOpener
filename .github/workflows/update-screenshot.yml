name: Update Workspace Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Install Puppeteer System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2t64 libxrandr2 libatk1.0-0 libcups2 \
            libxdamage1 libxfixes3 libxcomposite1

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take Screenshot
        run: |
          node << 'EOF'
          const puppeteer = require("puppeteer");
          const path = require("path");
          const fs = require("fs");

          (async () => {
            const browser = await puppeteer.launch({
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });
            const page = await browser.newPage();
            
            await page.setViewport({ width: 1920, height: 1080 });

            const filePath = "file://" + path.resolve("artifacts/new-tab/public/workspace.html");
            console.log("Loading page:", filePath);

            await page.goto(filePath, { waitUntil: "load", timeout: 30000 });

            await new Promise(r => setTimeout(r, 2000));

            await page.evaluate(() => {
              document.body.style.backgroundColor = "#ffffff";
            });

            if (!fs.existsSync("assets")) {
                fs.mkdirSync("assets");
            }

            await page.screenshot({ 
              path: "assets/workspace-preview.png", 
              fullPage: true,
              omitBackground: false 
            });
            
            await browser.close();
            console.log("Screenshot snapped successfully!");
          })();
          EOF

      - name: Commit and push screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-preview.png
          git diff --staged --quiet || (git commit -m "Updated preview screenshot" && git push origin HEAD:${{ github.ref_name }})
