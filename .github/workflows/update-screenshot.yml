name: Update Workspace Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2 libxrandr2 libatk1.0-0 libcups2 \
            libxdamage1 libxfixes3 libxcomposite1

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Take Screenshot
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const path = require("path");

          (async () => {
            const browser = await puppeteer.launch({
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });
            const page = await browser.newPage();
            
            // Set viewport size
            await page.setViewport({ width: 1920, height: 1080 });

            // Opens the local workspace.html file
            const filePath = "file://" + path.resolve("artifacts/new-tab/public/workspace.html");
            await page.goto(filePath, { waitUntil: "networkidle0" });

            // Waits for workspace.html to fully settle
            await new Promise(r => setTimeout(r, 1250));

            // makes sure the sidebar UI isnt too transparent.
            await page.evaluate(() => {
              document.body.style.backgroundColor = "#ffffff";
            });

            // Ensures directory exists
            const fs = require("fs");
            if (!fs.existsSync("assets")) {
                fs.mkdirSync("assets");
            }

            // screenshot plz
            await page.screenshot({ 
              path: "assets/workspace-preview.png", 
              fullPage: true,
              omitBackground: false 
            });
            
            await browser.close();
            console.log("Screenshot snapped successfully!");
          })();
          '

      - name: Commit and push screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-preview.png
          git diff --staged --quiet || (git commit -m "Updated preview screenshot" && git push origin HEAD:${{ github.ref_name }})
