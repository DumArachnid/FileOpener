name: Manual Base64 Release

on:
  workflow_dispatch:

jobs:
  release-base64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Self-Decoding Base64 HTML File
        run: |
          python -c '
          import base64

          file_path = "artifacts/new-tab/public/workspace.html"

          with open(file_path, "rb") as f:
              raw_bytes = f.read()

          b64_encoded = base64.b64encode(raw_bytes).decode("utf-8")

          wrapper_html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Base64 Mimo Version</title>
          </head>
          <body>
              <script>
                  const b64 = "{b64_encoded}";
                  
                  function b64DecodeUnicode(str) {{
                      return decodeURIComponent(atob(str).split("").map(function(c) {{
                          return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
                      }}).join(""));
                  }}

                  document.open();
                  document.write(b64DecodeUnicode(b64));
                  document.close();
              </script>
          </body>
          </html>"""

          with open("workspace-base64.html", "w", encoding="utf-8") as f:
              f.write(wrapper_html)
              
          print("Generated workspace-base64.html successfully!")
          '

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: workspace-base64.html
          tag_name: mimo-v${{ github.run_number }}
          name: "Base64 Version"
          body: "Manual self-extracting base64 build generated from `workspace.html` (Commit: `${{ github.sha }}`)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
