name: Self-Extracting HTML Builder

on:
  push:
    paths:
      - 'artifacts/new-tab/public/workspace.html'
  workflow_dispatch:

jobs:
  encode-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Self-Decoding Base64 Wrapper
        run: |
          python -c '
          import base64

          file_path = "artifacts/new-tab/public/workspace.html"

          # Read the current workspace.html bytes
          with open(file_path, "rb") as f:
              raw_bytes = f.read()

          # Encode to base64 string
          b64_encoded = base64.b64encode(raw_bytes).decode("utf-8")

          # Create the self-unpacking wrapper HTML
          wrapper_html = f"""<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"UTF-8\">
              <title>Workspace</title>
          </head>
          <body>
              <script>
                  const b64 = "{b64_encoded}";
                  
                  // UTF-8 safe base64 decoder
                  function b64DecodeUnicode(str) {{
                      return decodeURIComponent(atob(str).split("").map(function(c) {{
                          return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
                      }}).join(""));
                  }}

                  document.open();
                  document.write(b64DecodeUnicode(b64));
                  document.close();
              </script>
          </body>
          </html>"""

          # Overwrite workspace.html with the self-decoding version
          with open(file_path, "w", encoding="utf-8") as f:
              f.write(wrapper_html)
              
          print("Successfully transformed workspace.html into a self-extracting base64 payload!")
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/new-tab/public/workspace.html
          git diff --staged --quiet || git commit -m "Auto-convert workspace.html to self-extracting base64 [skip ci]"
          git push
