openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Username and password account operations
  - name: sync
    description: Signed-in workspace synchronization
  - name: extensions
    description: Online community extension store
  - name: moderation
    description: Moderator controls for extensions and accounts
  - name: developer
    description: Replit-authenticated developer controls
  - name: announcements
    description: Public Study Desk announcements managed by developers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /announcements/active:
    get:
      operationId: getActiveAnnouncement
      tags: [announcements]
      summary: Get the current site-wide announcement
      responses:
        "200":
          description: Current announcement, if one is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveAnnouncementState"
    post:
      operationId: publishAnnouncement
      tags: [announcements]
      summary: Publish a developer announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Announcement published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "400":
          description: Invalid announcement
        "401":
          description: Sign in required
        "403":
          description: Developer rank required
    delete:
      operationId: clearAnnouncement
      tags: [announcements]
      summary: End the current site-wide announcement
      responses:
        "204":
          description: Announcement ended
        "401":
          description: Sign in required
        "403":
          description: Developer rank required
  /announcements/stream:
    get:
      operationId: streamAnnouncements
      tags: [announcements]
      summary: Subscribe to site-wide announcement updates
      responses:
        "200":
          description: Server-sent announcement updates
          content:
            text/event-stream:
              schema:
                type: string
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created; recovery code is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "409":
          description: Username is already in use
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Username or password is incorrect
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not signed in
  /auth/recover:
    post:
      operationId: recoverAccount
      tags: [auth]
      summary: Reset a password using its recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryInput"
      responses:
        "200":
          description: Password reset; a replacement recovery code is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Recovery details are invalid
  /presence/heartbeat:
    post:
      operationId: heartbeatPresence
      tags: [auth]
      summary: Mark the signed-in account as recently active
      responses:
        "204":
          description: Presence recorded
        "401":
          description: Sign in required
  /developer/online-count:
    get:
      operationId: getDeveloperOnlineCount
      tags: [developer]
      summary: Get the number of recently active accounts
      responses:
        "200":
          description: Aggregate active account count; no account identities are returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperOnlineCount"
        "401":
          description: Sign in required
        "403":
          description: Developer rank required
  /sync:
    get:
      operationId: getWorkspaceSync
      tags: [sync]
      summary: Get synchronized workspace data
      responses:
        "200":
          description: Workspace data and revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSync"
        "401":
          description: Sign in required
    patch:
      operationId: updateWorkspaceSync
      tags: [sync]
      summary: Save changed workspace fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSyncUpdate"
      responses:
        "200":
          description: Updated workspace data and revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSync"
        "401":
          description: Sign in required
  /store/extensions:
    get:
      operationId: listPublicExtensions
      tags: [extensions]
      summary: List published extensions
      responses:
        "200":
          description: Published extensions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionList"
    post:
      operationId: createCommunityExtension
      tags: [extensions]
      summary: Create a private extension draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "401":
          description: Sign in required
  /store/extensions/{id}/reports:
    post:
      operationId: reportCommunityExtension
      tags: [extensions]
      summary: Report a published extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionReportInput"
      responses:
        "201":
          description: Report saved for moderator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionReportCreated"
        "401":
          description: Sign in required
        "404":
          description: Published extension not found
        "409":
          description: This account has already reported the extension
  /store/extensions/{id}:
    get:
      operationId: getPublicExtension
      tags: [extensions]
      summary: Get a published extension and its source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Extension details and source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "404":
          description: Extension not found
    patch:
      operationId: updateCommunityExtension
      tags: [extensions]
      summary: Update an owned extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionInput"
      responses:
        "200":
          description: Updated extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "401":
          description: Sign in required
        "404":
          description: Extension not found
    delete:
      operationId: deleteCommunityExtension
      tags: [extensions]
      summary: Delete an owned extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Sign in required
        "404":
          description: Extension not found
  /store/extensions/{id}/publish:
    post:
      operationId: publishCommunityExtension
      tags: [extensions]
      summary: Publish an owned extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "401":
          description: Sign in required
        "404":
          description: Extension not found
  /store/mine:
    get:
      operationId: listMyExtensions
      tags: [extensions]
      summary: List extensions owned by the current user
      responses:
        "200":
          description: Owned extensions, including private drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionList"
        "401":
          description: Sign in required
  /moderation/extensions:
    get:
      operationId: listModerationExtensions
      tags: [moderation]
      summary: List extensions awaiting moderator review
      responses:
        "200":
          description: Pending extensions with source code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationExtensionList"
        "403":
          description: Moderator access required
  /moderation/extensions/published:
    get:
      operationId: listPublishedModerationExtensions
      tags: [moderation]
      summary: List approved public extensions for moderator review
      responses:
        "200":
          description: Public extensions with source code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationExtensionList"
        "403":
          description: Moderator access required
  /moderation/extensions/removed:
    get:
      operationId: listRemovedModerationExtensions
      tags: [moderation]
      summary: List extensions hidden from the public store
      responses:
        "200":
          description: Hidden extensions with source code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationExtensionList"
        "403":
          description: Moderator access required
  /moderation/extension-reports:
    get:
      operationId: listCommunityExtensionReports
      tags: [moderation]
      summary: List open community extension reports
      responses:
        "200":
          description: Open reports with extension source and reporter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionReportList"
        "403":
          description: Moderator access required
  /moderation/extension-reports/{id}/review:
    post:
      operationId: reviewCommunityExtensionReport
      tags: [moderation]
      summary: Dismiss a report or hide its extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionReportReviewInput"
      responses:
        "200":
          description: Report reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionReportCreated"
        "403":
          description: Moderator access required
        "404":
          description: Open report not found
        "409":
          description: A moderator cannot hide their own extension
  /moderation/extensions/{id}/restore:
    post:
      operationId: restoreCommunityExtension
      tags: [moderation]
      summary: Restore a hidden extension to the public store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Extension restored to public listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "403":
          description: Moderator access required
        "404":
          description: Hidden extension not found
  /moderation/extensions/{id}/review:
    post:
      operationId: reviewCommunityExtension
      tags: [moderation]
      summary: Approve or reject an extension submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewExtensionInput"
      responses:
        "200":
          description: Updated moderation decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "403":
          description: Moderator access required
        "404":
          description: Pending extension not found
  /moderation/extensions/{id}/takedown:
    post:
      operationId: takeDownCommunityExtension
      tags: [moderation]
      summary: Remove an approved extension from the public store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionTakedownInput"
      responses:
        "200":
          description: Extension removed from public listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityExtension"
        "403":
          description: Moderator access required
        "404":
          description: Published extension not found
  /moderation/users:
    get:
      operationId: findModerationUser
      tags: [moderation]
      summary: Find an account by exact username
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      responses:
        "200":
          description: Account moderation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationUser"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
  /moderation/users/{username}/ban:
    patch:
      operationId: updateModerationUserBan
      tags: [moderation]
      summary: Ban or restore an account
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationBanInput"
      responses:
        "200":
          description: Updated account moderation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationUser"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
        "409":
          description: Cannot ban a moderator account
  /moderation/users/{username}/promote:
    post:
      operationId: promoteModerationUser
      tags: [moderation]
      summary: Promote a regular account to moderator
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      responses:
        "200":
          description: Promoted account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationUser"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
        "409":
          description: Account cannot be promoted
  /moderation/users/{username}/rewards:
    post:
      operationId: grantModerationUserRewards
      tags: [moderation]
      summary: Grant points or shards to an account
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRewardInput"
      responses:
        "200":
          description: Updated account reward totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRewardTotals"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
        "409":
          description: Cannot grant rewards to this account
  /moderation/users/{username}/unlock-all:
    post:
      operationId: unlockModerationUserFeatures
      tags: [moderation]
      summary: Unlock all study features for an account
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockFeaturesInput"
      responses:
        "200":
          description: All features unlocked for the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUnlockFeaturesResult"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
        "409":
          description: Cannot unlock features for this account
  /moderation/users/{username}/history:
    get:
      operationId: getModerationUserHistory
      tags: [moderation]
      summary: Get recent administrative actions for an account
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      responses:
        "200":
          description: Account moderation and reward history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHistoryList"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
  /moderation/users/{username}/tabs:
    get:
      operationId: getModerationUserSharedTabs
      tags: [moderation]
      summary: Get tabs explicitly shared by an account
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      responses:
        "200":
          description: Opt-in tab sharing status and site summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationSharedTabs"
        "403":
          description: Moderator access required
        "404":
          description: Account not found
  /rewards/admin-grants:
    get:
      operationId: getCurrentAccountAdminRewardGrants
      tags: [accounts]
      summary: Get rewards granted by Study Desk administrators
      responses:
        "200":
          description: Total administrator-granted points and shards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRewardGrantTotals"
        "401":
          description: Sign in required
  /developer/auth/user:
    get:
      operationId: getDeveloperAuthState
      tags: [developer]
      summary: Get the current developer authentication state
      responses:
        "200":
          description: Developer session and authorization state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperAuthState"
  /developer/login:
    get:
      operationId: beginDeveloperLogin
      tags: [developer]
      summary: Start Replit sign-in for developer controls
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Replit sign-in
  /developer/callback:
    get:
      operationId: completeDeveloperLogin
      tags: [developer]
      summary: Complete the developer sign-in callback
      responses:
        "302":
          description: Redirect to the validated return path
  /developer/logout:
    get:
      operationId: logOutDeveloper
      tags: [developer]
      summary: Sign out of developer controls
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after clearing the developer session
  /developer/auth/complete:
    get:
      operationId: completeDeveloperPopup
      tags: [developer]
      summary: Complete developer sign-in in a popup window
      responses:
        "200":
          description: Popup completion page
  /developer/accounts:
    get:
      operationId: findDeveloperManagedAccount
      tags: [developer]
      summary: Find a Study Desk account by exact username
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      responses:
        "200":
          description: Selected Study Desk account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationUser"
        "403":
          description: Authorized developer access required
        "404":
          description: Account not found
  /developer/accounts/{username}/role:
    patch:
      operationId: setDeveloperManagedAccountRole
      tags: [developer]
      summary: Set a Study Desk account role
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperRoleInput"
      responses:
        "200":
          description: Updated Study Desk account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationUser"
        "403":
          description: Authorized developer access required
        "404":
          description: Account not found
        "409":
          description: Cannot promote a banned account
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignUpInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[A-Za-z0-9_]+$"
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        password:
          type: string
          minLength: 1
          maxLength: 128
    RecoveryInput:
      type: object
      required: [username, recoveryCode, newPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        recoveryCode:
          type: string
          minLength: 12
          maxLength: 100
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    UserSummary:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [user, moderator, dev]
    AuthResult:
      type: object
      required: [user, recoveryCode]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        recoveryCode:
          type: ["string", "null"]
    CurrentUser:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
    WorkspaceSync:
      type: object
      required: [data, revision]
      properties:
        data:
          type: object
          additionalProperties:
            type: string
        revision:
          type: integer
          minimum: 0
    WorkspaceSyncUpdate:
      type: object
      required: [updates]
      properties:
        updates:
          type: object
          additionalProperties:
            type: ["string", "null"]
    ExtensionInput:
      type: object
      required: [name, description, code]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          minLength: 1
          maxLength: 500
        code:
          type: string
          minLength: 1
          maxLength: 200000
    ExtensionSummary:
      type: object
      required: [id, name, description, version, publisherUsername, published, approvalStatus, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        publisherUsername:
          type: string
        published:
          type: boolean
        approvalStatus:
          type: string
          enum: [draft, pending, approved, rejected, removed]
        moderationNote:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
    CommunityExtension:
      allOf:
        - $ref: "#/components/schemas/ExtensionSummary"
        - type: object
          required: [code]
          properties:
            code:
              type: string
    ExtensionList:
      type: array
      items:
        $ref: "#/components/schemas/ExtensionSummary"
    ModerationExtensionList:
      type: array
      items:
        $ref: "#/components/schemas/CommunityExtension"
    ReviewExtensionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 500
    ExtensionTakedownInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ExtensionReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    ExtensionReportCreated:
      type: object
      required: [id, extensionId, reason, status, createdAt]
      properties:
        id:
          type: integer
        extensionId:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [open, dismissed, actioned]
        createdAt:
          type: string
          format: date-time
    ExtensionReportReviewInput:
      type: object
