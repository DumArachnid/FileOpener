<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaNt0 Payload Scrambler & Shield</title>
    <style>
        :root {
            --bg: #f4efe6;
            --card: #ffffff;
            --border: #e6dfd5;
            --text-main: #27272a;
            --text-muted: #71717a;
            --accent: #c84b25;
            --accent-hover: #b03f1e;
            --input-bg: #faf8f5;
            --success: #16a34a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .header-title span {
            color: var(--accent);
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(200, 75, 37, 0.2);
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        button.secondary:hover {
            background: #f0ece1;
        }

        .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">
            <span>#</span> BaNt0 Shield & Scrambler
        </div>
        
        <label for="inputData">Input Payload / Text</label>
        <textarea id="inputData" placeholder="Drop text or link here..."></textarea>
        
        <div class="btn-group">
            <button onclick="scrambleText()">Scramble</button>
            <button class="secondary" onclick="descrambleText()">Descramble</button>
        </div>

        <label for="outputData">Result Output</label>
        <textarea id="outputData" placeholder="Result will appear here..." readonly></textarea>
        
        <div class="footer-note">Prefix stamp & dummy-bit matrix active.</div>
    </div>

    <script>
        const PREFIX = "BaNt0BadAshyNewTab-";
        const DUMMY_MARKER = "_";

        function scrambleText() {
            const raw = document.getElementById('inputData').value;
            if (!raw) return;

            try {
                // 1. Prepend the mandatory prefix
                const stamped = PREFIX + raw;

                // 2. Base64 encode it
                let encoded = btoa(encodeURIComponent(stamped));

                // 3. Add dummy bits based on length
                if (encoded.length > 100) {
                    // Evenly space dummy bits out every 15 characters
                    let spaced = "";
                    for (let i = 0; i < encoded.length; i++) {
                        spaced += encoded[i];
                        if ((i + 1) % 15 === 0) {
                            spaced += DUMMY_MARKER;
                        }
                    }
                    encoded = spaced;
                } else {
                    // Short payload padding
                    encoded = encoded + "===DUMMY";
                }

                document.getElementById('outputData').value = encoded;
            } catch (err) {
                document.getElementById('outputData').value = "Error during scrambling: " + err.message;
            }
        }

        function descrambleText() {
            const input = document.getElementById('inputData').value.trim();
            if (!input) return;

            try {
                let cleaned = input;

                // 1. Remove dummy bits (guess/reverse the spacing pattern or padding)
                if (cleaned.length > 100 || cleaned.includes(DUMMY_MARKER)) {
                    let unspaced = "";
                    let counter = 0;
                    for (let i = 0; i < cleaned.length; i++) {
                        if (cleaned[i] === DUMMY_MARKER && (counter % 16 === 15)) {
                            // Skip the injected dummy bit
                            continue;
                        }
                        unspaced += cleaned[i];
                        counter++;
                    }
                    cleaned = unspaced.replace(new RegExp(`\\${DUMMY_MARKER}`, 'g'), "");
                } else {
                    cleaned = cleaned.split("===DUMMY")[0];
                }

                // 2. Base64 decode
                const decodedBytes = atob(cleaned);
                const original = decodeURIComponent(decodedBytes);

                // 3. Check for the signature prefix and hand over cracked version
                if (original.startsWith(PREFIX)) {
                    const purePayload = original.slice(PREFIX.length);
                    document.getElementById('outputData').value = `[CRACKED SUCCESS]\n${purePayload}`;
                } else {
                    document.getElementById('outputData').value = `[WARNING] Decoded, but missing signature. Raw: ${original}`;
                }
            } catch (err) {
                document.getElementById('outputData').value = "Failed to descramble. Corrupted dummy bits or invalid string :/";
            }
        }
    </script>
</body>
</html>
