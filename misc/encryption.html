<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaNt0 Blind Stealth Shield</title>
    <style>
        :root {
            --bg: #f4efe6;
            --card: #ffffff;
            --border: #e6dfd5;
            --text-main: #27272a;
            --text-muted: #71717a;
            --accent: #c84b25;
            --accent-hover: #b03f1e;
            --input-bg: #faf8f5;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .header-title span {
            color: var(--accent);
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 85px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(200, 75, 37, 0.2);
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        button.secondary:hover {
            background: #f0ece1;
        }

        .status-box {
            font-family: monospace;
            font-size: 0.8rem;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            margin-bottom: 16px;
            min-height: 20px;
            word-break: break-all;
        }

        .status-box.success {
            background: var(--success-bg);
            border-color: #bbf7d0;
            color: var(--success-text);
        }

        .status-box.error {
            background: var(--error-bg);
            border-color: #fecaca;
            color: var(--error-text);
        }

        .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">
            <span>#</span> BaNt0 Blind Stealth Shield
        </div>
        
        <label for="inputData">Input Payload / Text</label>
        <textarea id="inputData" placeholder="Drop text or scrambled payload here..."></textarea>
        
        <div class="btn-group">
            <button onclick="scrambleText()">Scramble</button>
            <button class="secondary" onclick="descrambleText()">Descramble</button>
        </div>

        <label for="outputData">Result Output</label>
        <textarea id="outputData" placeholder="Result will appear here..." readonly></textarea>
        
        <label>Status Log</label>
        <div id="statusLog" class="status-box">Ready.</div>
        
        <div class="footer-note">Blind adaptive routing (<100 uneven / >=100 even) active.</div>
    </div>

    <script>
        const PREFIX = "BaNt0BadAshyNewTab-";
        const B64_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

        function setStatus(message, type = 'normal') {
            const log = document.getElementById('statusLog');
            log.className = 'status-box ' + type;
            log.textContent = message;
        }

        // --- UNEVEN ENCODING/DECODING (< 100 chars) ---
        function scrambleUneven(str, seed) {
            let s = seed;
            const lcg = () => {
                s = (s * 1664525 + 1013904223) % 4294967296;
                return s / 4294967296;
            };

            let result = "";
            let nextDecoyAt = Math.floor(lcg() * 5) + 1;
            let charCount = 0;

            for (let i = 0; i < str.length; i++) {
                result += str[i];
                charCount++;
                if (charCount === nextDecoyAt) {
                    const decoy = B64_ALPHABET[Math.floor(lcg() * B64_ALPHABET.length)];
                    result += decoy;
                    charCount = 0;
                    nextDecoyAt = Math.floor(lcg() * 8) + 1;
                }
            }
            return result;
        }

        function descrambleUneven(input, seed) {
            let s = seed;
            const lcg = () => {
                s = (s * 1664525 + 1013904223) % 4294967296;
                return s / 4294967296;
            };

            let restored = "";
            let nextDecoyAt = Math.floor(lcg() * 5) + 1;
            let charCount = 0;

            for (let i = 0; i < input.length; i++) {
                charCount++;
                if (charCount === nextDecoyAt) {
                    charCount = 0;
                    nextDecoyAt = Math.floor(lcg() * 8) + 1;
                } else {
                    restored += input[i];
                }
            }
            return restored;
        }

        // --- EVEN ENCODING/DECODING (>= 100 chars) ---
        function scrambleEven(str, interval) {
            let interleaved = "";
            let count = 0;
            for (let i = 0; i < str.length; i++) {
                interleaved += str[i];
                count++;
                if (count % interval === 0) {
                    const decoy = B64_ALPHABET[Math.floor(Math.random() * B64_ALPHABET.length)];
                    interleaved += decoy;
                }
            }
            return interleaved;
        }

        function descrambleEven(input, interval) {
            let restored = "";
            let count = 0;
            for (let i = 0; i < input.length; i++) {
                count++;
                if (count % (interval + 1) === 0) {
                    continue;
                }
                restored += input[i];
            }
            return restored;
        }

        // --- CORE BASE64 & PADDING RESTORATION ---
        function decodeAndVerify(restored) {
            const paddingMatch = restored.match(/(=+)$/);
            let core = restored;
            let padding = "";
            if (paddingMatch) {
                padding = paddingMatch[1];
                core = restored.slice(0, -padding.length);
            }

            const originalCore = core.split('').reverse().join('');
            const cleanB64 = originalCore + padding;

            const decodedBytes = atob(cleanB64);
            return decodeURIComponent(decodedBytes);
        }

        function scrambleText() {
            const raw = document.getElementById('inputData').value;
            if (!raw) {
                setStatus("Input field is empty.", "error");
                return;
            }

            try {
                const stamped = PREFIX + raw;
                const cleanB64 = btoa(encodeURIComponent(stamped));

                const paddingMatch = cleanB64.match(/(=+)$/);
                let core = cleanB64;
                let padding = "";
                if (paddingMatch) {
                    padding = paddingMatch[1];
                    core = cleanB64.slice(0, -padding.length);
                }

                const reversedCore = core.split('').reverse().join('');
                const reversedB64 = reversedCore + padding;

                let finalPayload = "";
                if (reversedB64.length < 100) {
                    const seed = Math.floor(Math.random() * 500) + 1;
                    finalPayload = scrambleUneven(reversedB64, seed);
                    setStatus(`Successfully scrambled (Uneven mode, Seed #${seed} applied invisibly).`, "success");
                } else {
                    const interval = Math.floor(Math.random() * 500) + 1;
                    finalPayload = scrambleEven(reversedB64, interval);
                    setStatus(`Successfully scrambled (Even mode, Interval #${interval} applied invisibly).`, "success");
                }

                document.getElementById('outputData').value = finalPayload;
            } catch (err) {
                setStatus("Error during scrambling: " + err.message, "error");
                document.getElementById('outputData').value = "";
            }
        }

        function descrambleText() {
            const input = document.getElementById('inputData').value.trim();
            if (!input) {
                setStatus("Input field is empty.", "error");
                return;
            }

            let cracked = false;
            let successPayload = "";

            // 1. Blindly try all 500 Uneven Seeds
            for (let seed = 1; seed <= 500; seed++) {
                try {
                    const restored = descrambleUneven(input, seed);
                    const original = decodeAndVerify(restored);
                    if (original.startsWith(PREFIX)) {
                        successPayload = original.slice(PREFIX.length);
                        cracked = true;
                        setStatus(`[CRACKED SUCCESS] Matched via Uneven Seed #${seed}!`, "success");
                        break;
                    }
                } catch (e) {}
            }

            // 2. If not found, blindly try all 500 Even Intervals
            if (!cracked) {
                for (let interval = 1; interval <= 500; interval++) {
                    try {
                        const restored = descrambleEven(input, interval);
                        const original = decodeAndVerify(restored);
                        if (original.startsWith(PREFIX)) {
                            successPayload = original.slice(PREFIX.length);
                            cracked = true;
                            setStatus(`[CRACKED SUCCESS] Matched via Even Interval #${interval}!`, "success");
                            break;
                        }
                    } catch (e) {}
                }
            }

            if (cracked) {
                document.getElementById('outputData').value = successPayload;
            } else {
                document.getElementById('outputData').value = "";
                setStatus(`[ERROR] Descramble failed: Exhausted all seeds & intervals (1-500).`, "error");
            }
        }
    </script>
</body>
</html>
