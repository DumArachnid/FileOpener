<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaNt0 Blind Stealth Shield</title>
    <style>
        :root {
            --bg: #f4efe6;
            --card: #ffffff;
            --border: #e6dfd5;
            --text-main: #27272a;
            --text-muted: #71717a;
            --accent: #c84b25;
            --accent-hover: #b03f1e;
            --input-bg: #faf8f5;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .header-title span {
            color: var(--accent);
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 85px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(200, 75, 37, 0.2);
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            box-shadow: none;
        }

        button.secondary:hover {
            background: #f0ece1;
        }

        .status-box {
            font-family: monospace;
            font-size: 0.8rem;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            margin-bottom: 16px;
            min-height: 20px;
            word-break: break-all;
        }

        .status-box.success {
            background: var(--success-bg);
            border-color: #bbf7d0;
            color: var(--success-text);
        }

        .status-box.error {
            background: var(--error-bg);
            border-color: #fecaca;
            color: var(--error-text);
        }

        .footer-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">
            <span>#</span> BaNt0 Blind Stealth Shield
        </div>
        
        <label for="inputData">Input Payload / Text</label>
        <textarea id="inputData" placeholder="Drop text or scrambled payload here..."></textarea>
        
        <div class="btn-group">
            <button onclick="scrambleText()">Scramble</button>
            <button class="secondary" onclick="descrambleText()">Descramble</button>
        </div>

        <label for="outputData">Result Output</label>
        <textarea id="outputData" placeholder="Result will appear here..." readonly></textarea>
        
        <label>Status Log</label>
        <div id="statusLog" class="status-box">Ready.</div>
        
        <div class="footer-note">Blind interval guessing matrix & reversed padding active.</div>
    </div>

    <script>
        const PREFIX = "BaNt0BadAshyNewTab-";
        const B64_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

        function setStatus(message, type = 'normal') {
            const log = document.getElementById('statusLog');
            log.className = 'status-box ' + type;
            log.textContent = message;
        }

        function scrambleText() {
            const raw = document.getElementById('inputData').value;
            if (!raw) {
                setStatus("Input field is empty.", "error");
                return;
            }

            try {
                // 1. Stamp with mandatory prefix
                const stamped = PREFIX + raw;

                // 2. Base64 encode
                const cleanB64 = btoa(encodeURIComponent(stamped));

                // 3. Isolate trailing padding (=) so padding stays strictly at the end
                const paddingMatch = cleanB64.match(/(=+)$/);
                let core = cleanB64;
                let padding = "";
                if (paddingMatch) {
                    padding = paddingMatch[1];
                    core = cleanB64.slice(0, -padding.length);
                }

                // Reverse only the core string, append padding back untouched
                const reversedCore = core.split('').reverse().join('');
                const reversedB64 = reversedCore + padding;

                // 4. Generate random secret interval between 1 and 500 (No header stored!)
                const interval = Math.floor(Math.random() * 500) + 1;

                // 5. Interleave decoys dynamically based on the random interval
                let interleaved = "";
                let count = 0;
                for (let i = 0; i < reversedB64.length; i++) {
                    interleaved += reversedB64[i];
                    count++;
                    if (count % interval === 0) {
                        const decoy = B64_ALPHABET[Math.floor(Math.random() * B64_ALPHABET.length)];
                        interleaved += decoy;
                    }
                }

                document.getElementById('outputData').value = interleaved;
                setStatus(`Successfully scrambled (Secret Interval #${interval} applied invisibly).`, "success");
            } catch (err) {
                setStatus("Error during scrambling: " + err.message, "error");
                document.getElementById('outputData').value = "";
            }
        }

        function descrambleText() {
            const input = document.getElementById('inputData').value.trim();
            if (!input) {
                setStatus("Input field is empty.", "error");
                return;
            }

            let cracked = false;
            let successPayload = "";
            let guessedInterval = 0;

            // Brute-force guessing intervals from 1 to 500
            for (let interval = 1; interval <= 500; interval++) {
                try {
                    // 1. Strip decoys using the current guess interval
                    let restored = "";
                    let count = 0;
                    for (let i = 0; i < input.length; i++) {
                        count++;
                        if (count % (interval + 1) === 0) {
                            continue; // Skip decoy
                        }
                        restored += input[i];
                    }

                    // 2. Separate padding from restored string to reverse core back safely
                    const paddingMatch = restored.match(/(=+)$/);
                    let core = restored;
                    let padding = "";
                    if (paddingMatch) {
                        padding = paddingMatch[1];
                        core = restored.slice(0, -padding.length);
                    }

                    const originalCore = core.split('').reverse().join('');
                    const cleanB64 = originalCore + padding;

                    // 3. Base64 & URI decode
                    const decodedBytes = atob(cleanB64);
                    const original = decodeURIComponent(decodedBytes);

                    // 4. Verify prefix signature
                    if (original.startsWith(PREFIX)) {
                        guessedInterval = interval;
                        successPayload = original.slice(PREFIX.length);
                        cracked = true;
                        break; // Found the correct interval!
                    }
                } catch (e) {
                    // This interval guessed wrong, let the loop try the next one
                }
            }

            if (cracked) {
                document.getElementById('outputData').value = successPayload;
                setStatus(`[CRACKED SUCCESS] Successfully guessed hidden interval #${guessedInterval}! Payload verified.`, "success");
            } else {
                document.getElementById('outputData').value = "";
                setStatus(`[ERROR] Descramble failed: Exhausted intervals (1-500). Invalid payload or corrupted string :/`, "error");
            }
        }
    </script>
</body>
</html>
